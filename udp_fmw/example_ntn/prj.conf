# Console and logs
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_NTN_GEO_UDP_LOG_LEVEL_INF=y
CONFIG_SERIAL=y
CONFIG_FPU=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# DK buttons
CONFIG_DK_LIBRARY=y

# Network sockets through the nRF modem
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# Modem libraries
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_SYSTEM_MODE_MODULE=y
CONFIG_LTE_LC_MODEM_EVENTS_MODULE=y
CONFIG_LTE_LC_CONNECTION_STATUS_MODULE=y
CONFIG_LTE_LC_PDN_MODULE=y
CONFIG_LTE_LC_RAI_MODULE=y
CONFIG_LTE_RAI_REQ=y
CONFIG_AT_MONITOR=y

# NTN modem firmware only. This keeps LTE Link Control aligned with the AT sequence.
CONFIG_LTE_NETWORK_MODE_NTN_NBIOT=y

# Memory
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=2048

# PSM/eDRX disabled for a first bring-up.
CONFIG_LTE_PSM_REQ=n
CONFIG_LTE_EDRX_REQ=n
