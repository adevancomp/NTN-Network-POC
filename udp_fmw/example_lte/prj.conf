# Console and logs
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LTE_UDP_BUTTON_LOG_LEVEL_INF=y
CONFIG_SERIAL=y
CONFIG_FPU=y
CONFIG_PICOLIBC_IO_FLOAT=y

# Network sockets through the nRF modem
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# Modem libraries
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_SYSTEM_MODE_MODULE=y
CONFIG_LTE_LC_MODEM_EVENTS_MODULE=y
CONFIG_LTE_LC_CONNECTION_STATUS_MODULE=y
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_SIM=y
CONFIG_MODEM_INFO_ADD_NETWORK=y
CONFIG_AT_MONITOR=y

# DK button support
CONFIG_DK_LIBRARY=y

# Memory
CONFIG_EVENTS=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=2048

# Boot with GNSS support, then switch to LTE-M + NB-IoT in code after the first fix.
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT_GPS=y
CONFIG_LTE_MODE_PREFERENCE_LTE_M_PLMN_PRIO=y

# UDP server
CONFIG_LTE_UDP_SERVER_ADDRESS="UDP SERVER IP"
CONFIG_LTE_UDP_SERVER_PORT=9000

# PSM/eDRX disabled for easier interactive button tests.
CONFIG_LTE_PSM_REQ=n
CONFIG_LTE_EDRX_REQ=n
